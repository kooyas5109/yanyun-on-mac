name: Signed and notarized release

on:
  workflow_dispatch:
    inputs:
      target:
        description: Application target
        required: true
        type: choice
        options:
          - yanyun
          - ywzh
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      RELEASE_TARGET: ${{ inputs.target || 'yanyun' }}
      RUNTIME_ARCHIVE_URL: ${{ secrets.RUNTIME_ARCHIVE_URL }}
      RUNTIME_ARCHIVE_SHA256: ${{ secrets.RUNTIME_ARCHIVE_SHA256 }}
      SIGN_ID: ${{ secrets.DEVELOPER_ID_APPLICATION }}
      APPLE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
      APPLE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate required secrets
        env:
          CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          API_KEY: ${{ secrets.APPSTORE_API_KEY_BASE64 }}
        run: |
          test -n "$RUNTIME_ARCHIVE_URL"
          test -n "$RUNTIME_ARCHIVE_SHA256"
          test -n "$SIGN_ID"
          test -n "$CERTIFICATE"
          test -n "$CERTIFICATE_PASSWORD"
          test -n "$APPLE_API_KEY_ID"
          test -n "$APPLE_API_ISSUER_ID"
          test -n "$API_KEY"

      - name: Restore and verify locked runtime
        run: |
          curl --fail --location --retry 3 \
            "$RUNTIME_ARCHIVE_URL" \
            --output "$RUNNER_TEMP/wine-release.tar.gz"
          echo "$RUNTIME_ARCHIVE_SHA256  $RUNNER_TEMP/wine-release.tar.gz" |
            shasum -a 256 -c -
          if tar -tzf "$RUNNER_TEMP/wine-release.tar.gz" |
             grep -Eq '(^/|(^|/)\.\.(/|$))'; then
            echo "Runtime archive contains an unsafe path" >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/runtime-extract"
          tar -xzf "$RUNNER_TEMP/wine-release.tar.gz" -C "$RUNNER_TEMP/runtime-extract"
          test -d "$RUNNER_TEMP/runtime-extract/wine-release"
          bash scripts/runtime/prepare-runtime.sh "$RUNNER_TEMP/runtime-extract/wine-release"

      - name: Install signing certificate
        env:
          CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          RELEASE_KEYCHAIN="$RUNNER_TEMP/release-signing.keychain-db"
          RELEASE_KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$CERTIFICATE" | base64 -D > "$RUNNER_TEMP/signing.p12"
          security create-keychain -p "$RELEASE_KEYCHAIN_PASSWORD" "$RELEASE_KEYCHAIN"
          security set-keychain-settings -lut 21600 "$RELEASE_KEYCHAIN"
          security unlock-keychain -p "$RELEASE_KEYCHAIN_PASSWORD" "$RELEASE_KEYCHAIN"
          security import "$RUNNER_TEMP/signing.p12" \
            -k "$RELEASE_KEYCHAIN" \
            -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$RELEASE_KEYCHAIN_PASSWORD" \
            "$RELEASE_KEYCHAIN"
          security list-keychains -d user -s "$RELEASE_KEYCHAIN"

      - name: Prepare App Store Connect API key
        env:
          API_KEY: ${{ secrets.APPSTORE_API_KEY_BASE64 }}
        run: |
          API_KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          echo "$API_KEY" | base64 -D > "$API_KEY_PATH"
          chmod 600 "$API_KEY_PATH"
          echo "APPLE_API_KEY_PATH=$API_KEY_PATH" >> "$GITHUB_ENV"

      - name: Install packaging dependency
        run: brew install create-dmg

      - name: Build, sign and notarize
        env:
          OUTPUT_DIR: ${{ github.workspace }}/release-output
          NOTARIZE: "1"
        run: bash scripts/build-release.sh "$RELEASE_TARGET"

      - name: Upload notarized DMG
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_TARGET }}-${{ github.ref_name }}
          path: release-output/*.dmg
          if-no-files-found: error
